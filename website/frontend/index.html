<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mana's Embrace - Where stories come alive. Read epic fantasy novels including The Beginning After The End with 500+ chapters available."
    />
    <title>Mana's Embrace - Read Epic Fantasy Novels Online</title>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-3WR1TS23B5"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-3WR1TS23B5");
    </script>

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical assets -->
    <link
      rel="preload"
      as="image"
      href="/assets/minicaera.webp"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/heroimage.webp"
      type="image/webp"
    />

    <!-- Inline critical CSS -->
    <style>
      :root {
        --background: #0a0a0f;
        --surface: #1a1a2e;
        --text-primary: #ffffff;
        --text-secondary: #c7c7d8;
        --accent: #8b5cf6;
        --accent-hover: #7c3aed;
        --accent-light: #a78bfa;
        --accent-glow: rgba(139, 92, 246, 0.3);
        --border: #2d2d4d;
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(
          135deg,
          var(--background) 0%,
          #1a1a2e 25%,
          #2d2d4d 50%,
          #1a1a2e 75%,
          var(--background) 100%
        );
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .hero {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 3rem 2rem;
        overflow: hidden;
        background: var(--background);
        border-radius: 2rem;
        margin: 2rem 1rem;
        backdrop-filter: blur(20px);
      }
      .hero h1 {
        background: linear-gradient(
          135deg,
          var(--text-primary) 0%,
          var(--accent-light) 50%,
          var(--accent) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 4rem;
        font-weight: 800;
        margin-bottom: 1.5rem;
      }
      .hero-subtitle {
        font-size: 1.25rem;
        color: var(--text-secondary);
        margin-bottom: 2rem;
      }
      .navbar {
        background: rgba(26, 26, 46, 0.95);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .loading-skeleton {
        background: linear-gradient(
          90deg,
          #2a2a2a 25%,
          #3a3a3a 50%,
          #2a2a2a 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>

    <!-- Preload and defer fonts -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
    /></noscript>

    <!-- Optimized icon -->
    <link rel="icon" href="./src/assets/minicaera.png" type="image/png" />

    <!-- Remove duplicate Font Awesome - handled in main.js -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
