services:
  frontend:
    build:
      context: ./website/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://manaapi.dicki.org
    networks:
      - tbate-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./website/backend/novels:/app/novels:ro
      - ./website/backend/images:/app/images:ro
      - backend-data:/app
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:3001,http://172.30.0.1:3001,https://mana.dicki.org,https://www.mana.dicki.org
      - ENABLE_DOCS=true
      - DOMAIN=localhost
    networks:
      - tbate-network
    restart: unless-stopped

volumes:
  backend-data:

networks:
  tbate-network:
    driver: bridge
